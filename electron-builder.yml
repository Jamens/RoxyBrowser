appId: com.roxyclone.desktop
productName: RoxyBrowserClone
copyright: Copyright © 2026 RoxyBrowser Clone

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - resources/**
  - package.json
  # AI Agent Support 模式的知识源（产品文档），打包后安装版才能检索到
  # README = 架构/目录/命令；FEATURES = 功能详细说明，两者都是知识源，缺一不可
  - README.md
  - FEATURES.md
  # 更新记录（仅随包分发，不参与检索）
  - CHANGELOG.md

# 原生镜像读取需要真实路径，因此把 resources 从 asar 中解包
asarUnpack:
  - resources/**

# 国内镜像，避免 Electron 二进制下载超时
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

npmRebuild: false
compression: maximum

win:
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-${platform}-${arch}.${ext}
  # 代码签名（证书就绪，本地无证书时 electron-builder 自动跳过、仅告警，不破坏构建）：
  #   正式分发前设置环境变量后执行 pnpm dist：
  #     CSC_LINK         = .pfx 证书路径或下载 URL（Authenticode 代码签名证书，EV 更佳）
  #     CSC_KEY_PASSWORD = 证书私钥密码
  #   主程序 exe 与 NSIS 安装包会被自动签名；Portable 版为 7z 自解包无法签名，仅作内部分发。
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

portable:
  artifactName: ${productName}-${version}-${platform}-${arch}-Portable.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: RoxyBrowser Clone
  createDesktopShortcut: true
  createStartMenuShortcut: true
  language: '2052'
  deleteAppDataOnUninstall: false

# 自动更新 feed：pnpm dist 会把 latest.yml + 安装包上传到该地址；
# 正式分发时可用环境变量 UPDATE_FEED_URL 覆盖为你的托管地址。
publish:
  - provider: generic
    url: https://update.roxyclone.com
